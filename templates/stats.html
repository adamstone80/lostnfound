{% extends 'base.html' %}
{% block content %}
  <h1 class="page-title">Community Statistics</h1>
  <p>Total reports: {{ total }} — Lost: {{ lost }} — Found: {{ found }}</p>
  <h2 class="section-heading">Popular Categories</h2>
  <ul>
    {% for cat, c in popular %}
      <li>{{ cat }} — {{ c }}</li>
    {% else %}
      <li class="meta-text">No data yet</li>
    {% endfor %}
  </ul>
{% endblock %}
