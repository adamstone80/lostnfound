{% extends 'base.html' %}
{% block content %}
  <h1 class="page-title">Report Item</h1>
  <form method="post" enctype="multipart/form-data">

    <div class="mb-4">
      <label class="form-label section-heading d-block">What happened?</label>
      <div class="kind-toggle">
        <input type="radio" name="kind" value="lost" id="kind-lost" checked>
        <label for="kind-lost">Lost it</label>
        <input type="radio" name="kind" value="found" id="kind-found">
        <label for="kind-found">Found it</label>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="section-heading">Item Details</h2>
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input class="form-control" name="title" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description"></textarea>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Category</label>
            <input class="form-control" name="category" placeholder="e.g., electronics, keys, wallet, clothing">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Photo</label>
            <input class="form-control" type="file" name="photo">
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="section-heading">Location</h2>
        <div class="mb-3">
          <label class="form-label">Location name</label>
          <input class="form-control" name="location" placeholder="e.g., Galston Park, Sydney">
        </div>
        <div class="mb-2">
          <label class="form-label">Pinpoint on map</label>
          <div class="map-picker">
            <div id="location-picker"></div>
            <div class="map-picker-pin">📍</div>
          </div>
          <small class="meta-text" id="picked-coords">Drag the map to move the pin</small>
          <input type="hidden" name="lat" id="lat-input">
          <input type="hidden" name="lng" id="lng-input">
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="section-heading">Verification & Visibility</h2>
        <div class="mb-3">
          <label class="form-label">Expires in (days)</label>
          <input class="form-control" name="expires_days" value="30">
        </div>
        <div class="mb-3">
          <label class="form-label">Verification question (for new claimants)</label>
          <input class="form-control" name="verification_question" placeholder="e.g., what sticker is on the back?">
          <small class="meta-text">Only shown to someone attempting to claim this item — never displayed publicly.</small>
        </div>
        <div class="mb-3">
          <label class="form-label">Verification answer</label>
          <input class="form-control" name="verification_answer">
        </div>
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" name="anonymous" id="anon">
          <label class="form-check-label" for="anon">Report anonymously</label>
        </div>
      </div>
    </div>

    <button class="btn btn-primary">Submit</button>
  </form>
{% endblock %}
